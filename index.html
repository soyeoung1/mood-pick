<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <meta name="description" content="오늘의 기분을 해시태그로 꺼내면, 그 마음에 맞는 영화와 애니를 골라드려요.">
  <title>Mood Pick · 오늘의 기분 영화·애니</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="screens">
      <section id="screen-home" class="screen" aria-label="홈"></section>
      <section id="screen-result" class="screen" aria-label="추천" hidden></section>
      <section id="screen-mine" class="screen" aria-label="내 기록" hidden></section>
    </main>

    <nav id="tabbar" aria-label="메뉴">
      <button class="tab" data-screen="home"><span class="tab-ico">🏠</span><span>홈</span></button>
      <button class="tab" data-screen="result"><span class="tab-ico">✨</span><span>추천</span></button>
      <button class="tab" data-screen="mine"><span class="tab-ico">📒</span><span>내 기록</span></button>
    </nav>

    <div id="sheet-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript>이 서비스는 JavaScript가 필요해요.</noscript>
  <script src="app.js"></script>
</body>
</html>
